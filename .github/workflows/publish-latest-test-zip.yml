name: Publish latest test ZIP

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: latest-test-release
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: windows-latest
    steps:
      - name: Check out the committed version
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install app dependencies
        run: npm ci

      - name: Create the app ZIP
        shell: pwsh
        run: |
          $rootFiles = @(
            'app.js',
            'assets.js',
            'electron-main.js',
            'electron-preload.js',
            'hero-template-config.js',
            'index.html',
            'keywords.js',
            'package-lock.json',
            'package.json',
            'render.js',
            'state.js',
            'styles.css',
            'ui.js',
            'Run Legedit Desktop.cmd',
            'Run Legedit Desktop.vbs'
          )
          $include = @($rootFiles) + @('assets', 'Legenedit', 'node_modules')
          $missing = $include | Where-Object { -not (Test-Path -LiteralPath $_) }
          if ($missing) { throw "Required app files are missing: $($missing -join ', ')" }
          New-Item -ItemType Directory -Path 'dist' -Force | Out-Null
          Compress-Archive -LiteralPath $include -DestinationPath 'dist/Legedit-test-current.zip' -CompressionLevel Optimal

      - name: Replace the latest test release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = 'test-latest'
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release delete $tag --yes --cleanup-tag
            if ($LASTEXITCODE -ne 0) { throw 'Could not replace the previous test release.' }
          }
          $notes = "Automatically built from commit $env:GITHUB_SHA. Download Legedit-test-current.zip."
          gh release create $tag 'dist/Legedit-test-current.zip' --target $env:GITHUB_SHA --title 'Latest test build' --notes $notes --prerelease --latest=false
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish the test ZIP.' }
